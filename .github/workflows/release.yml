name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.0.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alexwitherspoon/aviationwx.org-archiver

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-26.04
    # Only run when CI succeeded, or manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.outputs.outputs.version }}
      ref: ${{ steps.outputs.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.version) || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve version and ref
        id: outputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            REF="refs/tags/${VERSION}"
          else
            # workflow_run: find v* tag on the commit CI ran on
            SHA="${{ github.event.workflow_run.head_sha }}"
            git fetch --depth=1 origin +refs/tags/*:refs/tags/* 2>/dev/null || true
            TAGS=$(git tag --points-at "$SHA" 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [ -z "$TAGS" ]; then
              echo "No v* tag on commit $SHA, skipping release"
              echo "version=" >> $GITHUB_OUTPUT
              echo "ref=" >> $GITHUB_OUTPUT
              exit 0
            fi
            VERSION="$TAGS"
            REF="refs/tags/${VERSION}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT

  build-docker:
    name: Build and push Docker image
    runs-on: ubuntu-26.04
    needs: [resolve-version]
    if: needs.resolve-version.outputs.version != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}

      - name: Get version
        id: version
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NUM=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            GIT_SHA=${{ steps.version.outputs.VERSION }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    needs: [build-docker, resolve-version]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}

      - name: Get version
        id: version
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NUM=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: AviationWX Archiver ${{ steps.version.outputs.VERSION }}
          body: |
            ## AviationWX.org Archiver ${{ steps.version.outputs.VERSION }}

            ### Docker

            ```bash
            docker pull ghcr.io/alexwitherspoon/aviationwx.org-archiver:${{ steps.version.outputs.VERSION_NUM }}
            ```

            Or use `:latest` for the latest stable release.
          draft: false
          prerelease: false
